[package]
name = "Garage"
version = "0.1.0"
edition = "2024"
default-run = "Garage"

[dependencies]
wgpu = "22.1.0"
winit = { version = "0.29.15", features = ["rwh_06"] }
fontdue = "0.9.3"
log = "0.4"
env_logger = "0.11"
pollster = "0.3"
bytemuck = { version = "1.15", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
resvg = "0.38.0"
portable-pty = "0.8"
vte = "0.11"
